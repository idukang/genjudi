[package]
name = "tauri-plugin-account-session"
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-account-session"

[dependencies]
tauri = { version = "=2.12.6", default-features = false, features = ["wry"] }
serde = { version = "1", features = ["derive"] }
